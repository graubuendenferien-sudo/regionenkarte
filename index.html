<!--
  Regionenkarte mit einer einzigen hervorgehobenen Region.

  Welche Region hervorgehoben wird, lässt sich auf zwei Arten festlegen:
  1. Per URL-Parameter (empfohlen, eine Datei für alle Regionenseiten):
       regionenkarte.html?region=chur
  2. Fest im HTML über das Attribut data-region am <body> (siehe unten).
  Der URL-Parameter hat Vorrang.

  Mehrere Regionen: mit Komma trennen, z. B.
       regionenkarte.html?region=chur,heidiland,praettigau
       <body data-region="chur,heidiland">

  Farbe der Hervorhebung (Farben aus dem GRF-Evolution-Styleguide):
       regionenkarte.html?region=chur&farbe=eisblau
       <body data-region="chur" data-farbe="eisblau">
  Gültige Farben: granit (Standard), eisblau, minzgruen, abendrot,
  honiggelb, waldgruen, schiefer

  Gültige Werte:
    chur, heidiland, praettigau, davos-klosters, arosa-lenzerheide,
    berguen-filisur, val-surses-savognin-bivio, viamala, flims-laax-falera,
    surselva, disentis-sedrun, vals, san-bernardino-mesolcina-calanca,
    bregaglia-maloja, valposchiavo, engadin-st-moritz,
    engadin-samnaun-val-muestair
-->
<style>
  :root {
    --granit: #79775F;
    --granit-75: #A19E8C;
    --highlight-stroke: #79775F;
    --highlight-fill: rgba(121, 119, 95, .3);
    --line-soft: rgba(121, 119, 95, .65);
    --bg: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); -webkit-tap-highlight-color: transparent; }
  .map-wrap { width: 100%; max-width: 760px; margin: 0 auto; }
  .region-map { display: block; width: 100%; height: auto; overflow: visible; }
  .region {
    fill: transparent;
    stroke: var(--line-soft);
    stroke-width: 1.4;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }
  .region.is-highlighted {
    fill: var(--highlight-fill);
    stroke: var(--highlight-stroke);
    stroke-width: 2.2;
  }
  .map-outline {
    fill: none;
    stroke: var(--highlight-stroke);
    stroke-width: 2;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    pointer-events: none;
  }
  /* Übersicht: Lage von Graubünden in der Schweiz (unten links) */
  .ch-inset { pointer-events: none; }
  .ch-shape { fill: #E0DFD9; }
  .ch-gr { fill: var(--highlight-stroke); }
</style>

    "bregaglia-maloja":                 { index: 2,  name: "Bregaglia Maloja" },
    "valposchiavo":                     { index: 14, name: "Valposchiavo" },
    "engadin-st-moritz":                { index: 7,  name: "Engadin St. Moritz" },
    "engadin-samnaun-val-muestair":     { index: 6,  name: "Engadin Samnaun Val Müstair" }
  };
  // Alternative Schreibweisen (z. B. Slugs der Regionenseiten auf graubuenden.ch)
  const ALIASES = {
    "chur-rheintal": "chur",
    "bregaglia-engadin": "bregaglia-maloja",
    "bregaglia": "bregaglia-maloja"
  };

  (() => {
    const map = document.querySelector(".region-map");
    if (!map) return;

    // Surselva-Fläche ohne Vals, damit bei "surselva" Vals nicht mit eingefärbt wird
    const defs = map.querySelector("defs");
    const surselva = map.querySelector('.region[data-index="12"]');
    const vals = map.querySelector('.region[data-index="16"]');
    if (defs && surselva && vals) {
      const ns = "http://www.w3.org/2000/svg";
      const mask = document.createElementNS(ns, "mask");
      mask.setAttribute("id", "surselva-excludes-vals");
      mask.setAttribute("maskUnits", "userSpaceOnUse");
      mask.setAttribute("x", "0"); mask.setAttribute("y", "0");
      mask.setAttribute("width", "760"); mask.setAttribute("height", "545");
      const base = document.createElementNS(ns, "rect");
      base.setAttribute("width", "760"); base.setAttribute("height", "545"); base.setAttribute("fill", "#fff");
      const cut = document.createElementNS(ns, "path");
      cut.setAttribute("d", vals.getAttribute("d"));
      cut.setAttribute("fill", "#000");
      cut.setAttribute("fill-rule", "evenodd");
      mask.append(base, cut);
      defs.appendChild(mask);
      surselva.setAttribute("mask", "url(#surselva-excludes-vals)");
    }

    const normalize = value => (value || "").toString().trim().toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    // Farben aus dem GRF-Evolution-Styleguide
    const COLORS = {
      "granit":    "#79775F",
      "eisblau":   "#4E769C",
      "minzgruen": "#58A291",
      "abendrot":  "#A45248",
      "honiggelb": "#F2A900",
      "waldgruen": "#115740",
      "schiefer":  "#3C3C3C"
    };
    const COLOR_ALIASES = {
      "ice-blue": "eisblau", "mint-green": "minzgruen", "sunset-red": "abendrot",
      "honey-yellow": "honiggelb", "forest-green": "waldgruen", "slate": "schiefer", "slate-gray": "schiefer"
    };
    const params = new URLSearchParams(window.location.search);
    let colorKey = normalize(params.get("farbe") || params.get("color") || document.body.dataset.farbe || "granit");
    colorKey = COLOR_ALIASES[colorKey] || colorKey;
    const hex = COLORS[colorKey] || COLORS.granit;
    const rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
    document.documentElement.style.setProperty("--highlight-stroke", hex);
    document.documentElement.style.setProperty("--highlight-fill", "rgba(" + rgb.join(", ") + ", .3)");
    // Alle Linien in der gewählten Farbe: Kantonsgrenze voll, Regionsgrenzen etwas heller
    document.documentElement.style.setProperty("--line-soft", "rgba(" + rgb.join(", ") + ", .65)");

    const param = params.get("region");
    const raw = param || document.body.dataset.region || "";
    // Mehrere Regionen mit Komma trennen, z. B. "chur,heidiland"
    const regions = [];
    raw.split(",").forEach(part => {
      let key = normalize(part);
      key = ALIASES[key] || key;
      const region = REGIONS[key];
      if (region && !regions.includes(region)) regions.push(region);
    });
    if (!regions.length) return;

    regions.forEach(region => {
      const path = map.querySelector('.region[data-index="' + region.index + '"]');
      if (!path) return;
      path.classList.add("is-highlighted");
      // Hervorgehobene Region zuoberst zeichnen, damit ihr Rand nicht von Nachbarn verdeckt wird
      path.parentNode.appendChild(path);
    });
    const label = document.getElementById("map-label");
    if (label) label.textContent = "Karte von Graubünden, hervorgehoben: " + regions.map(r => r.name).join(", ");
  })();

  // Schweiz-Übersicht: Kantonsumriss der Hauptkarte wiederverwenden (gleiche Projektion, deckungsgleich)
  (() => {
    const outline = document.querySelector(".region-map .map-outline");
    const gr = document.getElementById("ch-gr");
    if (outline && gr) gr.setAttribute("d", outline.getAttribute("d"));
  })();

  // Höhe an einen umgebenden iframe melden (wie im Hauptmodul)
  (() => {
    if (window.parent === window) return;
    let lastHeight = 0;
    let scheduled = false;
    const measure = () => {
      scheduled = false;
      const height = Math.ceil(Math.max(document.documentElement.scrollHeight, document.body.scrollHeight));
      if (height > 0 && Math.abs(height - lastHeight) >= 2) {
        lastHeight = height;
        window.parent.postMessage({ height }, "*");
      }
    };
    const schedule = () => {
      if (scheduled) return;
      scheduled = true;
      window.requestAnimationFrame(measure);
    };
    if ("ResizeObserver" in window) new ResizeObserver(schedule).observe(document.body);
    window.addEventListener("load", schedule, { once: true });
    window.addEventListener("resize", schedule, { passive: true });
    schedule();
    window.setTimeout(schedule, 250);
  })();
</script>
</body>
</html>
