<script>
  // Zuordnung Region -> Fläche in der Karte (data-index)
  const REGIONS = {
    "chur":                             { index: 3,  name: "Chur" },
    "heidiland":                        { index: 9,  name: "Heidiland" },
    "praettigau":                       { index: 10, name: "Prättigau" },
    "davos-klosters":                   { index: 4,  name: "Davos Klosters" },
    "arosa-lenzerheide":                { index: 0,  name: "Arosa Lenzerheide" },
    "berguen-filisur":                  { index: 1,  name: "Bergün Filisur" },
    "val-surses-savognin-bivio":        { index: 13, name: "Val Surses Savognin Bivio" },
    "viamala":                          { index: 15, name: "Viamala" },
    "flims-laax-falera":                { index: 8,  name: "Flims Laax Falera" },
    "surselva":                         { index: 12, name: "Surselva" },
    "disentis-sedrun":                  { index: 5,  name: "Disentis Sedrun" },
    "vals":                             { index: 16, name: "Vals" },
    "san-bernardino-mesolcina-calanca": { index: 11, name: "San Bernardino Mesolcina Calanca" },
    "bregaglia-maloja":                 { index: 2,  name: "Bregaglia Maloja" },
    "valposchiavo":                     { index: 14, name: "Valposchiavo" },
    "engadin-st-moritz":                { index: 7,  name: "Engadin St. Moritz" },
    "engadin-samnaun-val-muestair":     { index: 6,  name: "Engadin Samnaun Val Müstair" }
  };
  // Alternative Schreibweisen (z. B. Slugs der Regionenseiten auf graubuenden.ch)
  const ALIASES = {
    "chur-rheintal": "chur",
    "bregaglia-engadin": "bregaglia-maloja",
    "bregaglia": "bregaglia-maloja"
  };

  (() => {
    const map = document.querySelector(".region-map");
    if (!map) return;

    // Surselva-Fläche ohne Vals, damit bei "surselva" Vals nicht mit eingefärbt wird
    const defs = map.querySelector("defs");
    const surselva = map.querySelector('.region[data-index="12"]');
    const vals = map.querySelector('.region[data-index="16"]');
    if (defs && surselva && vals) {
      const ns = "http://www.w3.org/2000/svg";
      const mask = document.createElementNS(ns, "mask");
      mask.setAttribute("id", "surselva-excludes-vals");
      mask.setAttribute("maskUnits", "userSpaceOnUse");
      mask.setAttribute("x", "0"); mask.setAttribute("y", "0");
      mask.setAttribute("width", "760"); mask.setAttribute("height", "545");
      const base = document.createElementNS(ns, "rect");
      base.setAttribute("width", "760"); base.setAttribute("height", "545"); base.setAttribute("fill", "#fff");
      const cut = document.createElementNS(ns, "path");
      cut.setAttribute("d", vals.getAttribute("d"));
      cut.setAttribute("fill", "#000");
      cut.setAttribute("fill-rule", "evenodd");
      mask.append(base, cut);
      defs.appendChild(mask);
      surselva.setAttribute("mask", "url(#surselva-excludes-vals)");
    }

    const normalize = value => (value || "").toString().trim().toLowerCase()
      .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const param = new URLSearchParams(window.location.search).get("region");
    let key = normalize(param || document.body.dataset.region);
    key = ALIASES[key] || key;
    const region = REGIONS[key];
    if (!region) return;

    const path = map.querySelector('.region[data-index="' + region.index + '"]');
    if (!path) return;
    path.classList.add("is-highlighted");
    // Hervorgehobene Region zuoberst zeichnen, damit ihr Rand nicht von Nachbarn verdeckt wird
    path.parentNode.appendChild(path);
    const label = document.getElementById("map-label");
    if (label) label.textContent = "Karte von Graubünden, hervorgehoben: " + region.name;
  })();

  // Höhe an einen umgebenden iframe melden (wie im Hauptmodul)
  (() => {
    if (window.parent === window) return;
    let lastHeight = 0;
    let scheduled = false;
    const measure = () => {
      scheduled = false;
      const height = Math.ceil(Math.max(document.documentElement.scrollHeight, document.body.scrollHeight));
      if (height > 0 && Math.abs(height - lastHeight) >= 2) {
        lastHeight = height;
        window.parent.postMessage({ height }, "*");
      }
    };
    const schedule = () => {
      if (scheduled) return;
      scheduled = true;
      window.requestAnimationFrame(measure);
    };
    if ("ResizeObserver" in window) new ResizeObserver(schedule).observe(document.body);
    window.addEventListener("load", schedule, { once: true });
    window.addEventListener("resize", schedule, { passive: true });
    schedule();
    window.setTimeout(schedule, 250);
  })();
</script>
